<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COM111: Dynamic SDG Impact Board</title>
    <!-- Bootstrap 5.3 CSS for layout constraints -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="py-4">
    <div class="container board-container">
        <!-- Header -->
        <header class="text-center mb-4">
            <span class="badge bg-success mb-2">Live-Coding</span>
            <h1 class="fw-bold text-dark">SDG Impact Action Board</h1>
            <p class="text-muted">Master DOM Node Creation, Tree Traversal, and Event Delegation</p>
        </header>
        <!-- Action Control Bar -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="h5 mb-0 text-muted">Active Initiatives</h3>
            <!-- New Save Button (Bootstrap Styling aligned with Session 6) -->
            <button id="save-btn" class="btn btn-success d-flex align-items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-download" viewBox="0 0 16 16">
                    <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5"/>
                    <path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708z"/>
                </svg>
                Save Actions Locally
            </button>
        </div>
        <!-- Form Card to Add Action Items -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <form id="action-form">
                    <div class="row g-3">
                        <div class="col-md-7">
                            <input type="text" id="action-input" class="form-control" placeholder="Action item (e.g., Install Solar Arrays)" required>
                        </div>
                        <div class="col-md-3">
                            <select id="priority-select" class="form-select">
                                <option value="low">Low Impact</option>
                                <option value="medium" selected>Medium Impact</option>
                                <option value="high">High Impact</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-success w-100 fw-bold">Add</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Dynamic Content Container -->
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fw-bold">Action Initiatives List</h5>
                <span id="card-counter" class="badge bg-secondary">Total: 0 Items</span>
            </div>
            
            <!-- Parent Container: Our Event Delegation Hub -->
            <ul id="action-list" class="list-group list-group-flush">
                <!-- Dynamically constructed elements will be appended here -->
            </ul>
        </div>

    </div>

    <script src="./js/dynamic.js"></script>
</body>
</html>
