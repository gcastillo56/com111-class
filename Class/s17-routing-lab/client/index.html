<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SustainHub API Tester</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="py-4">
    <div class="container" style="max-width: 900px;">
        <header class="pb-3 mb-4 border-bottom d-flex justify-content-between align-items-center">
            <h1 class="h3 fw-bold text-success">🌿 SustainHub Modular API Client</h1>
            <span id="auth-status" class="badge bg-secondary">Status: Anonymous (No Token)</span>
        </header>

        <div class="row g-4">
            <!-- Controls Panel -->
            <div class="col-md-5">
                <div class="card shadow-sm p-3 mb-3">
                    <h5 class="card-title h6 fw-bold">1. Authentication</h5>
                    <div class="d-grid gap-2">
                        <button id="login-user-btn" class="btn btn-outline-primary btn-sm">Login as Researcher (User)</button>
                        <button id="login-admin-btn" class="btn btn-outline-success btn-sm">Login as Admin</button>
                        <button id="clear-token-btn" class="btn btn-outline-secondary btn-sm">Clear Token</button>
                    </div>
                </div>

                <div class="card shadow-sm p-3 mb-3">
                    <h5 class="card-title h6 fw-bold">2. Protected Endpoints</h5>
                    <div class="d-grid gap-2">
                        <button id="get-all-btn" class="btn btn-primary btn-sm">GET /api/initiatives</button>
                        <button id="get-one-btn" class="btn btn-info btn-sm text-white">GET /api/initiatives/1</button>
                        <button id="delete-admin-btn" class="btn btn-danger btn-sm">DELETE /api/initiatives/1 (Admin Only)</button>
                        <button id="trigger-404-btn" class="btn btn-warning btn-sm">GET /api/unknown-route</button>
                    </div>
                </div>

                <div class="card shadow-sm p-3">
                    <h5 class="card-title h6 fw-bold">3. Create Initiative (POST)</h5>
                    <input type="text" id="init-title" class="form-control form-control-sm mb-2" placeholder="Title (e.g. Bio-Gas Digester)">
                    <select id="init-priority" class="form-select form-select-sm mb-2">
                        <option value="High">High Priority</option>
                        <option value="Medium">Medium Priority</option>
                    </select>
                    <button id="post-init-btn" class="btn btn-success btn-sm w-100">POST /api/initiatives</button>
                </div>
            </div>

            <!-- Terminal Output Window -->
            <div class="col-md-7">
                <label class="form-label fw-bold">Live API Output Stream:</label>
                <pre id="output" class="response-box p-3 m-0">Click any action button to test response...</pre>
            </div>
        </div>
    </div>

    <script src="./js/client.js"></script>
</body>
</html>
