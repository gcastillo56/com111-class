<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalog Exam Interface</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="bg-body-tertiary">

  <!-- Top Navbar & Search -->
  <nav class="navbar navbar-expand-lg bg-secondary navbar-dark sticky-top shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="#" id="brand-reset">
        </span> -- Your app name ---
      </a>
      <form class="d-flex" id="search-form" role="search">
        <div class="input-group">
          <input class="form-control" type="search" id="search-input" placeholder="Search by name or ID..." aria-label="Search">
          <button class="btn btn-dark" type="submit">Search</button>
          <button class="btn btn-outline-light d-none" type="button" id="clear-search-btn">Reset</button>
        </div>
      </form>
    </div>
  </nav>

  <main class="container py-4">
    <!-- Loading Indicator -->
    <div id="loading-spinner" class="text-center my-5 d-none">
      <div class="spinner-border text-info" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <p class="mt-2 text-secondary">Querying Express Backend...</p>
    </div>

    <!-- Error Screen -->
    <div id="error-view" class="alert alert-secondary text-center my-4 d-none" role="alert">
      <h4 class="alert-heading fw-bold">Entry Not Found!</h4>
      <p id="error-message">The requested Entry does not exist in the database.</p>
      <hr>
      <button class="btn btn-outline-dark" id="error-reset-btn">Return to Full Catalog</button>
    </div>

    <!-- Scrollable Catalog Grid -->
    <section id="catalog-section">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0 text-secondary" id="catalog-subtitle">Catalog</h5>
        <span class="badge bg-secondary" id="catalog-count">0 entries</span>
      </div>
      <div class="catalog-scroll-container p-2 rounded border bg-body">
        <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-6 g-3" id="catalog-grid">
          <!-- Dynamically populated via app.js -->
        </div>
      </div>
    </section>
  </main>

  <!-- Detail Modal with Left/Right Navigation -->
  <div class="modal fade" id="characters-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-header bg-info text-white">
          <h5 class="modal-title fw-bold text-capitalize" id="modal-name">Character Name</h5>
          <span class="badge bg-dark ms-2 fs-6" id="modal-id">#000</span>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body p-4">
          <div class="row align-items-center">
            <!-- Left Column: Sprite & Types -->
            <div class="col-md-5 text-center mb-3 mb-md-0">
              <div class="sprite-wrapper p-3 rounded bg-body-tertiary border mb-3">
                <img id="modal-img" src="" alt="Character Sprite" class="img-fluid characters-detail-img">
              </div>
              <div id="modal-types" class="d-flex justify-content-center gap-2 flex-wrap"></div>
            </div>

            <!-- Right Column: Stats, Abilities, Moves, Characteristics, etc. -->
            <div class="col-md-7">
              <div class="row g-2 text-center mb-3">
                <div class="col-4">
                  <div class="p-2 border rounded bg-body-tertiary">
                    <small class="text-secondary d-block">Age</small>
                    <span class="fw-bold" id="modal-exp">-</span>
                  </div>
                </div>
                <div class="col-4">
                  <div class="p-2 border rounded bg-body-tertiary">
                    <small class="text-secondary d-block">Height</small>
                    <span class="fw-bold" id="modal-height">-</span>
                  </div>
                </div>
                <div class="col-4">
                  <div class="p-2 border rounded bg-body-tertiary">
                    <small class="text-secondary d-block">Weight</small>
                    <span class="fw-bold" id="modal-weight">-</span>
                  </div>
                </div>
              </div>
              <!-- Add the details requested in your exercise. -->
              <div class="mb-3">
                <h6 class="fw-bold text-secondary mb-1">Features</h6>
                <div id="modal-abilities" class="d-flex flex-wrap gap-1"></div>
              </div>

              <div>
                <h6 class="fw-bold text-secondary mb-1">Characteristics</h6>
                <div id="modal-moves" class="moves-scroll-box p-2 border rounded bg-body-tertiary d-flex flex-wrap gap-1"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="modal-footer d-flex justify-content-between bg-body-tertiary">
          <button type="button" class="btn btn-outline-light px-4" id="prev-btn">
            &larr; Previous
          </button>
          <span class="text-secondary small">Use Left / Right arrows to navigate</span>
          <button type="button" class="btn btn-outline-light px-4" id="next-btn">
            Next &rarr;
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
